name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: pip install -e .[dev]
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files --color=always
      - name: Run tests with coverage
        run: pytest --cov=src --cov-report=xml --cov-report=term-missing -q
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: pip install -e .[dev]
      - name: Run security checks with bandit
        run: bandit -r src -f json -o bandit-report.json || true
      - name: Run code quality checks with ruff
        run: ruff check src
      - name: Run code formatting checks with black
        run: black --check src
      - name: Run import sorting checks with isort
        run: isort --check-only src

  integration-tests:
    runs-on: ubuntu-latest
    needs: [test, quality]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: pip install -e .[dev]
      - name: Run integration tests
        run: |
          # Run validation tests
          python validate_engine.py || echo "Validation tests completed"
          # Run edge case tests
          python -m pytest tests/test_edge_cases.py -v

  documentation:
    runs-on: ubuntu-latest
    needs: [test, quality]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: pip install -e .[dev]
      - name: Check for documentation completeness
        run: |
          # Check that all modules have docstrings
          python -c "
          import ast
          import os
          
          def check_docstrings(directory):
              missing_docstrings = []
              for root, dirs, files in os.walk(directory):
                  for file in files:
                      if file.endswith('.py'):
                          file_path = os.path.join(root, file)
                          with open(file_path, 'r') as f:
                              try:
                                  tree = ast.parse(f.read())
                                  if not ast.get_docstring(tree):
                                      missing_docstrings.append(file_path)
                              except SyntaxError:
                                  pass
              return missing_docstrings
          
          missing = check_docstrings('src/genomics_microcosting')
          if missing:
              print('Files missing module docstrings:')
              for f in missing:
                  print(f'  {f}')
              # For now, we won't fail the build but just report
          else:
              print('All modules have docstrings')
          "

  publish:
    runs-on: ubuntu-latest
    needs: [integration-tests, documentation]
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: pip install -e .[dev]
      - name: Build package
        run: |
          pip install build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}