name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.15.1']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.13.8'
      - name: Install locked dependencies
        run: |
          uv sync --locked --python 3.15.1
          .venv/bin/python -c 'import sys; assert sys.version_info[:3] == (3, 15, 1), sys.version'
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Install Gitleaks
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Scan outgoing commits for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            gitleaks git --redact --log-opts="$BASE_SHA..HEAD"
          else
            gitleaks git --redact
          fi
      - name: Run pre-commit and the full test suite with coverage
        env:
          MICROCOSTING_CI_COVERAGE: '1'
          COVERAGE_FILE: ${{ runner.temp }}/microcosting.coverage
          COVERAGE_XML: ${{ runner.temp }}/microcosting-coverage.xml
        run: .venv/bin/pre-commit run --all-files --show-diff-on-failure --color=always
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ${{ runner.temp }}/microcosting-coverage.xml
          use_oidc: true
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.15.1'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.13.8'
      - name: Install locked dependencies
        run: |
          uv sync --locked --python 3.15.1
          .venv/bin/python -c 'import sys; assert sys.version_info[:3] == (3, 15, 1), sys.version'
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Run security checks with bandit
        run: bandit -r src -f json -o bandit-report.json
      - name: Run code quality checks with ruff
        run: ruff check src
      - name: Run Ruff formatting checks
        run: ruff format --check src
      - name: Run strict typing checks
        run: basedpyright

  integration-tests:
    runs-on: ubuntu-latest
    needs: [test, quality]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.15.1'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.13.8'
      - name: Install locked dependencies
        run: |
          uv sync --locked --python 3.15.1
          .venv/bin/python -c 'import sys; assert sys.version_info[:3] == (3, 15, 1), sys.version'
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Run integration tests
        env:
          MICROCOSTING_OUTPUT_DIR: ${{ runner.temp }}/microcosting-validation
        run: |
          .venv/bin/python validate_engine.py
          .venv/bin/python -m pytest tests/test_edge_cases.py -v

  package:
    runs-on: ubuntu-latest
    needs: [test, quality]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.15.1'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.13.8'
      - name: Install locked dependencies
        run: |
          uv sync --locked --python 3.15.1
          .venv/bin/python -c 'import sys; assert sys.version_info[:3] == (3, 15, 1), sys.version'
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Build and verify source-only distributions
        run: |
          uv build --python .venv/bin/python
          .venv/bin/python tools/check_package.py dist

  publish:
    runs-on: ubuntu-latest
    needs: [integration-tests, package]
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.15.1'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.13.8'
      - name: Install locked dependencies
        run: |
          uv sync --locked --python 3.15.1
          .venv/bin/python -c 'import sys; assert sys.version_info[:3] == (3, 15, 1), sys.version'
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Build package
        run: |
          uv build --python .venv/bin/python
          .venv/bin/python tools/check_package.py dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
