# Genomics Microcosting Configuration
# Standardized column naming taxonomy for consistent data handling

# Column Naming Standards:
# - Use snake_case for programmatic names
# - Remove currency symbols and units (stored as metadata)
# - Use descriptive abbreviations: dsa=deterministic_sensitivity_analysis,
#   bi=budget_impact, comp=compute, stor=storage, vcgs=victorian_clinical_genetics_service
# - Standardize uncertainty bounds: lower_bound, estimate, upper_bound
# - Use consistent prefixes: unit_cost_, price_, quantity_, etc.

default_workbook: validation

# Type specifications for standardized column handling
type_specifications:
  # Identifier columns
  test:
    data_type: "string"
    category: "identifier"
    nullable: false
    description: "Test or assay name"
  category:
    data_type: "categorical"
    category: "identifier"
    nullable: false
    description: "Test category"
  sub_category:
    data_type: "categorical"
    category: "identifier"
    nullable: true
    description: "Test sub-category"
  step:
    data_type: "string"
    category: "identifier"
    nullable: true
    description: "Process step"

  # Cost columns
  unit_cost_aud_per_unit:
    data_type: "currency"
    category: "cost"
    nullable: true
    min_value: 0
    unit: "AUD per unit"
    description: "Final calculated cost per test unit"
  price_aud_per_unit:
    data_type: "currency"
    category: "cost"
    nullable: true
    min_value: 0
    unit: "AUD per unit"
    description: "Base price per unit before calculations"
  list_price_aud:
    data_type: "currency"
    category: "cost"
    nullable: true
    min_value: 0
    unit: "AUD"
    description: "Manufacturer's list price"
  annualized_cost_aud:
    data_type: "currency"
    category: "cost"
    nullable: true
    min_value: 0
    unit: "AUD per year"
    description: "Annualized equipment cost"

  # Quantity columns
  quantity_per_test:
    data_type: "float"
    category: "quantity"
    nullable: true
    min_value: 0
    unit: "units per test"
    description: "Resource quantity required per test"
  monthly_volume:
    data_type: "integer"
    category: "quantity"
    nullable: true
    min_value: 0
    unit: "tests per month"
    description: "Monthly test volume"
  useful_life_years:
    data_type: "integer"
    category: "quantity"
    nullable: true
    min_value: 1
    unit: "years"
    description: "Equipment useful life in years"

  # Rate columns
  hourly_rate_aud:
    data_type: "currency"
    category: "rate"
    nullable: true
    min_value: 0
    unit: "AUD per hour"
    description: "Labor hourly rate"
  annual_salary_aud:
    data_type: "currency"
    category: "rate"
    nullable: true
    min_value: 0
    unit: "AUD per year"
    description: "Annual labor salary"

  # Metadata columns
  labor_type:
    data_type: "categorical"
    category: "metadata"
    nullable: false
    description: "Type of labor"
  equipment_name:
    data_type: "string"
    category: "metadata"
    nullable: false
    description: "Equipment name or description"
  test_type:
    data_type: "categorical"
    category: "metadata"
    nullable: false
    description: "Type of test"

