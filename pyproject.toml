[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unimelb-phd-phase_1"
version = "0.1.0"
description = "{{PROJECT_DESCRIPTION}}"
packages = ["unimelb_phd_phase_1"]

license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "openpyxl",
    "pandas",
    "numpy-financial",
    "PyYAML",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["unimelb_phd_phase_1*"]

[project.optional-dependencies]
dev = [
    "pytest",
    "pre-commit",
    "ruff",
    "isort",
    "black",
    "bandit",
]

[project.scripts]
validate-engine = "validate_engine:validate_engine"
prepare-data = "prepare_data:main"
