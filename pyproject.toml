[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genomics-microcosting"
version = "0.2.0"
description = "{{PROJECT_DESCRIPTION}}"

license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "openpyxl",
    "pandas",
    "numpy",
    "numpy-financial",
    "PyYAML",
    "scipy",
    "flask",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pre-commit",
    "ruff",
    "black",
    "isort",
    "bandit",
    "pyarrow",
    "weasyprint",
    "jinja2",
    "markdown",
    "plotly",
    "seaborn",
    # Note: hypothesis is not compatible with Python 3.13
    # "hypothesis",
]

[project.scripts]
validate-engine = "genomics_microcosting.validate_engine:validate_engine"
prepare-data = "genomics_microcosting.prepare_data:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["genomics_microcosting*"]

[tool.pytest.ini_options]
addopts = "-p no:hypothesis"
testpaths = ["tests"]
env = [
    "MPLBACKEND=Agg",
]

[tool.ruff.lint]
# Allow sys.path modifications before imports in scripts
ignore = ["E402"]
