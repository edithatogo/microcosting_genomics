default_language_version:
  python: python3.15

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: c0f278f1254ccc8fb09676bcdb8d847e7db493e5 # frozen: v0.17.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
        types: [file]
        files: \.(yaml|yml|cff)$
      - id: check-toml
      - id: check-json

  - repo: local
    hooks:
      - id: gitleaks
        name: staged secret scan
        entry: gitleaks git --pre-commit --staged --redact
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: .venv/bin/python tools/select_tests.py
        language: system
        pass_filenames: true
        always_run: false
        files: '(^.*\.py$|^pyproject\.toml$|^uv\.lock$|^data/)'
